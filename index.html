<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>NEMO — مساعدك الشخصي</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><span class="brand-dot"></span><div><h1>NEMO</h1><p>مساعدك الشخصي</p></div></div>
      <span class="status" id="status">جاهز</span>
    </header>

    <section class="hero">
      <div class="orb-wrap" id="orbWrap">
        <div class="orb"><div class="orb-core"></div></div>
      </div>
      <h2 id="headline">أهلًا، أنا نيمو</h2>
      <p class="sub" id="subline">اضغطي على الميكروفون وابدئي كلامك</p>
      <button class="mic" id="micBtn" aria-label="ابدأ التحدث"><span>🎙</span></button>
      <p class="hint" id="hint">اضغطي للتحدث • يحتاج إذن الميكروفون</p>
    </section>

    <section class="conversation">
      <div class="section-title"><span>المحادثة</span><button id="clearBtn">مسح</button></div>
      <div id="messages" class="messages">
        <div class="bubble nemo">أنا نيمو. أقدر أساعدك في تنظيم أفكارك وتجربة أوامر بسيطة. النسخة دي نموذج أولي، ولسه مش متصلة بخدمة ذكاء اصطناعي.</div>
      </div>
      <form id="chatForm">
        <input id="messageInput" autocomplete="off" placeholder="اكتبي رسالة لنيمو..." />
        <button type="submit" aria-label="إرسال">➤</button>
      </form>
    </section>

    <footer>نسخة تجريبية مجانية • NEMO</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
